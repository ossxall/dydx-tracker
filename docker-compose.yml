services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dydx_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tracker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tracker:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dydx_tracker}
      INDEXER_DATABASE_URL: postgresql://tracker_reader:${INDEXER_DB_PASSWORD:?Set INDEXER_DB_PASSWORD in .env}@postgres:5432/dydx_dev
      START_AT: ${START_AT:-2024-11-17T00:00:00Z}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      BATCH_SIZE: ${BATCH_SIZE:-1000}
      REPLAY_BLOCKS: ${REPLAY_BLOCKS:-20}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tracker-db:
